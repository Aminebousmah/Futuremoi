[project]
name = "freelance-radar"
version = "0.1.0"
description = "Veille d'offres freelance Data + generation de candidatures"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "Jinja2>=3.1",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    # Generation du CV en PDF. Pur Python : le controle d'application
    # de Windows bloque les extensions compilees (WeasyPrint, Playwright).
    "fpdf2>=2.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
web  = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev  = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
radar = "freelance_radar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freelance_radar = ["templates/*.j2", "web/templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Jeu de regles explicite : les resultats du lint ne doivent pas dependre de la
# configuration globale de la machine qui l'execute.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer impose ses idiomes : appels dans les valeurs par defaut (B008) et
# Optional[...] plutot que `| None`, mieux supporte par son introspection.
"src/freelance_radar/cli.py" = ["B008", "UP007", "UP045"]
# Les modules d'agregation re-exportent volontairement des symboles.
"**/__init__.py" = ["F401"]
